<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Index</title>
	<link rel="stylesheet" type="text/css" href="/style.css">
</head>
<body>

<!-- This page will contain the split screen layout with block workshpace and live JS code viewer -->
	<nav id="nav-bar">
		<a href="/" id="nav-editor">Editor</a>
		<a href="/projects/" id="nav-projects">My projects</a>
		<a href="/login/" id="nav-login">Login</a>
		<span id="nav-auth-status"></span>
	</nav>

	<div id="save-bar" style="display: none;">
		<input type="text" id="project-name-input" placeholder="Project name">
		<button id="save-button">Save</button>
		<span id="save-message"></span>
	</div>

	<div id="editor-layout">
		<div id="menu">
			<h2>Blocks</h2>
			<div id="block-list"></div>
		</div>

		<div id="block-panel">
			<h2>Editor Workspace</h2>
			<div id="block-workspace">
				<!-- we will put the dragged blocks here for the user to work in -->
			</div>
		</div>

		<div id="code-panel">
			<h2>JavaScript Code Viewer</h2>
			<!-- we will put the outputted code based on the blocks here -->
		</div>
	</div>

	<div id="run-output-panel">
		<h2>Output</h2>
		<pre id="run-output"></pre>
	</div>

<script src="/main.js"></script>
<script src="blocks.js"></script>
<script src="editor.js"></script>
</body>
</html>
