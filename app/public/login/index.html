<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Login / Sign Up</title>
	<link rel="stylesheet" type="text/css" href="/style.css">
</head>
<body>

	<nav id="nav-bar">
		<a href="/" id="nav-editor">Editor</a>
		<a href="/projects/" id="nav-projects">My projects</a>
		<a href="/login/" id="nav-login">Login</a>
		<span id="nav-auth-status"></span>
	</nav>
	
	<div id="login-container">

		<div id="login-view">
			<h1>Welcome to JS Scripting</h1>

			<p>
				<label for="login-username-input">Username:</label>
				<input type="text" id="login-username-input">
			</p>
			<p>
				<label for="login-password-input">Password:</label>
				<input type="text" id="login-password-input">
			</p>

			<button id="login-button">Login</button>
			Not yet a Member?<a href="#" id="show-signup-link">Register</a>
			<p id="login-message"></p>
		</div>

		<div id="signup-view">
			<h1>Welcome to JS Scripting</h1>

			<p>
				<label for="signup-username-input">Username:</label>
				<input type="text" id="signup-username-input">
			</p>
			<p>
				<label for="signup-password-input">Password:</label>
				<input type="text" id="signup-password-input">
			</p>

			<button id="signup-button">Register</button>
			Already a Member?<a href="#" id="show-login-link">Login</a>
			<p id="signup-message"></p>
		</div>

	</div>

<script src="/main.js"></script>
</body>
</html>
